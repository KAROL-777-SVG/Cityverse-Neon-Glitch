<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cityverse — Neon Glitch</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; overflow:hidden;
    font-family:'Arial Black', sans-serif;
    height:100vh; display:flex; align-items:center; justify-content:center;
  }
  #loader {
    position:fixed; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; transition:opacity 0.8s ease;
  }
  #loader.hide { opacity:0; pointer-events:none; }

  .logo {
    font-size:clamp(2.5rem, 8vw, 6rem);
    font-weight:900; color:#fff; letter-spacing:0.2em;
    position:relative; text-transform:uppercase;
    text-shadow:0 0 20px #00f0ff, 0 0 40px #00f0ff;
    animation:glitch 2s infinite;
  }
  .logo::before, .logo::after {
    content:attr(data-text); position:absolute; top:0; left:0;
    width:100%; height:100%;
  }
  .logo::before {
    color:#ff00c8; z-index:-1;
    animation:glitchShift 0.4s infinite;
    text-shadow:-2px 0 #ff00c8;
  }
  .logo::after {
    color:#00fff0; z-index:-2;
    animation:glitchShift 0.3s infinite reverse;
    text-shadow:2px 0 #00fff0;
  }
  @keyframes glitch {
    0%,90%,100% { transform:translate(0); }
    92% { transform:translate(-2px,1px); }
    94% { transform:translate(2px,-1px); }
    96% { transform:translate(-1px,-2px); }
  }
  @keyframes glitchShift {
    0%,100% { clip-path:inset(0 0 0 0); }
    20% { clip-path:inset(20% 0 60% 0); }
    40% { clip-path:inset(60% 0 20% 0); }
    60% { clip-path:inset(40% 0 40% 0); }
    80% { clip-path:inset(10% 0 80% 0); }
  }

  .progress-wrap {
    margin-top:3rem; width:min(400px, 80vw); height:4px;
    background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden;
  }
  .progress-bar {
    height:100%; width:0%; background:linear-gradient(90deg,#00f0ff,#ff00c8);
    box-shadow:0 0 15px #00f0ff; transition:width 0.1s linear;
  }
  .percent {
    margin-top:1rem; color:#00f0ff; font-size:0.9rem;
    letter-spacing:0.3em; font-family:monospace;
  }

  /* MENU */
  #menu {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
    opacity:0; pointer-events:none; transition:opacity 0.8s;
    z-index:100;
  }
  #menu.show { opacity:1; pointer-events:auto; }
  #menu .title {
    font-size:clamp(3rem, 10vw, 7rem); color:#fff; letter-spacing:0.15em;
    text-shadow:0 0 30px #00f0ff, 0 0 60px #00f0ff;
    margin-bottom:4rem;
  }
  #menu .title span { color:#ff00c8; text-shadow:0 0 30px #ff00c8; }
  .menu-btn {
    width:min(360px, 80vw); padding:1.2rem 2rem; margin:0.6rem 0;
    background:transparent; border:2px solid #00f0ff; color:#00f0ff;
    font-size:1.1rem; letter-spacing:0.25em; cursor:pointer;
    font-weight:700; text-transform:uppercase; position:relative;
    overflow:hidden; transition:all 0.3s; font-family:inherit;
    clip-path:polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%);
  }
  .menu-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, #00f0ff, transparent);
    transform:translateX(-100%); transition:transform 0.5s;
  }
  .menu-btn:hover { color:#000; box-shadow:0 0 30px #00f0ff; }
  .menu-btn:hover::before { transform:translateX(0); }
  .menu-btn span { position:relative; z-index:1; }
</style>
</head>
<body>

<div id="loader">
  <div class="logo" data-text="CITYVERSE">CITYVERSE</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="percent" id="pct">0%</div>
</div>

<div id="menu">
  <div class="title">CITY<span>VERSE</span></div>
  <button class="menu-btn" onclick="transition('Free Roam')"><span>Free Roam</span></button>
  <button class="menu-btn" onclick="transition('Racing')"><span>Racing</span></button>
  <button class="menu-btn" onclick="transition('Garage')"><span>Garage</span></button>
  <button class="menu-btn" onclick="transition('Settings')"><span>Settings</span></button>
</div>

<script>
// LOADER ANIMATION
let p = 0;
const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
const timer = setInterval(() => {
  p += Math.random() * 8;
  if (p >= 100) { p = 100; clearInterval(timer); finish(); }
  bar.style.width = p + '%';
  pct.textContent = Math.floor(p) + '%';
}, 120);

function finish() {
  setTimeout(() => {
    document.getElementById('loader').classList.add('hide');
    document.getElementById('menu').classList.add('show');
  }, 500);
}

// SECTION TRANSITION
function transition(name) {
  const menu = document.getElementById('menu');
  // Glitch flash
  const flash = document.createElement('div');
  flash.style.cssText = `position:fixed;inset:0;z-index:9998;background:#00f0ff;
    animation:flash 0.6s ease-out forwards;pointer-events:none;`;
  document.body.appendChild(flash);
  menu.style.filter = 'blur(8px)';
  setTimeout(() => {
    alert(`➡️ ${name} bo'limiga o'tildi`);
    menu.style.filter = '';
    flash.remove();
  }, 600);
}
const style = document.createElement('style');
style.textContent = `@keyframes flash {
  0% { opacity:0; clip-path:inset(50% 0 50% 0); }
  50% { opacity:0.8; clip-path:inset(0 0 0 0); }
  100% { opacity:0; clip-path:inset(50% 0 50% 0); }
}`;
document.head.appendChild(style);
</script>
</body>
</html>
